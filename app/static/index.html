<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>TeslaCam Viewer</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.4.7" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F697;</text></svg>">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">&#x26A1;</span>
        <span class="logo-text">TeslaCam Viewer</span>
      </div>
      <div class="controls">
        <div class="filter-group">
          <button class="filter-btn active" data-type="">All</button>
          <button class="filter-btn" data-type="saved">Saved</button>
          <button class="filter-btn" data-type="sentry">Sentry</button>
          <button class="filter-btn" data-type="recent">Recent</button>
        </div>
        <div class="date-filters">
          <input type="date" id="fromDate" title="From date" />
          <span class="date-sep">–</span>
          <input type="date" id="toDate" title="To date" />
          <button id="clearDates" class="btn-icon" title="Clear dates" aria-label="Clear dates">✕</button>
        </div>
      </div>
      <div class="status" id="status">Loading…</div>
    </header>

    <main class="main">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span id="eventCount">0 events</span>
          <div class="sidebar-actions">
            <button id="backToListBtn" class="btn-icon" title="Toggle event list" aria-label="Toggle event list" hidden>&#x2630;</button>
            <button id="refreshBtn" class="btn-icon" title="Refresh" aria-label="Refresh">&#x21BB;</button>
          </div>
        </div>
        <div class="event-list" id="eventList"></div>
        <div class="load-more" id="loadMore" style="display:none;">
          <button id="loadMoreBtn">Load more</button>
        </div>
      </aside>

      <section class="player-area" id="playerArea">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">&#x1F4F9;</div>
          <h2>Select an event</h2>
          <p>Choose a clip from the list to view multi-camera playback</p>
        </div>

        <div class="player-container" id="playerContainer" style="display:none;">
          <div class="player-header">
            <button id="playerListBtn" class="btn-icon player-list-btn" title="Toggle event list" aria-label="Toggle event list" hidden>&#x2630;</button>
            <div class="event-info">
              <span class="event-type-badge" id="eventTypeBadge"></span>
              <span class="event-datetime" id="eventDatetime"></span>
            </div>
          </div>

          <div class="camera-stage">
            <div class="camera-grid" id="cameraGrid"></div>
            <div id="bufferingOverlay" class="buffering-overlay" hidden>
              <div class="buffering-spinner" aria-hidden="true"></div>
              <div class="buffering-label">Buffering…</div>
            </div>
            <div id="hud" class="hud" hidden>
              <div class="hud-cluster">
                <div class="hud-ap-wrap">
                  <div class="hud-ap" id="hudAp">MANUAL</div>
                  <div class="hud-ap-ver" id="hudApVer" hidden></div>
                </div>
                <div class="hud-steer">
                  <div class="hud-blink hud-blink-l" id="hudBlinkL"></div>
                  <div class="hud-wheel-wrap" id="hudWheel">
                    <div class="hud-wheel-icon">
                      <div class="hud-wheel-stroke"></div>
                      <div class="hud-wheel-fill"></div>
                    </div>
                  </div>
                  <div class="hud-blink hud-blink-r" id="hudBlinkR"></div>
                </div>
                <div class="hud-pedals">
                  <div class="hud-pedal-col">
                    <div class="hud-pedal-label">ACC</div>
                    <div class="hud-acc" title="Accelerator">
                      <div class="hud-acc-base"></div>
                      <div class="hud-accel-fill" id="hudAccelFill"></div>
                    </div>
                  </div>
                  <div class="hud-pedal-col">
                    <div class="hud-pedal-label">BRK</div>
                    <div class="hud-brake" id="hudBrake" title="Brake">
                      <div class="hud-brake-base"></div>
                      <div class="hud-brake-fill"></div>
                    </div>
                  </div>
                </div>
                <div class="hud-readout">
                  <div class="hud-speed" id="hudSpeed">0</div>
                  <div class="hud-speed-unit">km/h</div>
                  <div class="hud-gear" id="hudGear">P</div>
                </div>
              </div>
            </div>
          </div>

          <div class="event-meta" id="eventMeta" style="display:none;"></div>

          <div class="player-transport">
            <div class="player-seek">
              <div class="seek-wrap">
                <div id="eventTick" class="event-tick" hidden></div>
                <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
              </div>
            </div>
            <div class="player-buttons">
              <button id="syncPlayBtn" class="btn primary" title="Play / Pause all">&#x25B6; Play</button>
              <button id="skipBackBtn" class="btn" title="Rewind 5 seconds" aria-label="Rewind 5 seconds">−5s</button>
              <button id="skipFwdBtn" class="btn" title="Forward 5 seconds" aria-label="Forward 5 seconds">+5s</button>
              <button id="hudBtn" class="btn" title="Toggle driving HUD">HUD</button>
              <button id="frontFsBtn" class="btn btn-front-fs" title="Expand front camera only" aria-label="Expand front camera only">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span>Front</span>
              </button>
              <span id="timeDisplay">0:00 / 0:00</span>
            </div>
          </div>
        </div>
      </section>
      <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    </main>
  </div>

  <div id="fsLayer" class="fs-layer" hidden>
    <div class="fs-bar">
      <span id="fsLabel" class="fs-label"></span>
      <button type="button" id="fsPlayBtn" class="btn primary">&#x25B6; Play</button>
      <button type="button" id="fsSkipBackBtn" class="btn" title="Rewind 5 seconds">−5s</button>
      <button type="button" id="fsSkipFwdBtn" class="btn" title="Forward 5 seconds">+5s</button>
      <span id="fsTime" class="fs-time">0:00</span>
      <button type="button" id="fsCloseBtn" class="btn primary">Close</button>
    </div>
    <div class="fs-stage">
      <video id="fsVideo" class="active" playsinline webkit-playsinline></video>
      <video id="fsStandby" class="standby" playsinline webkit-playsinline></video>
      <div id="fsBuffering" class="buffering-overlay" hidden>
        <div class="buffering-spinner" aria-hidden="true"></div>
        <div class="buffering-label">Buffering…</div>
      </div>
    </div>
    <div id="fsHud" class="hud hud-fs" hidden></div>
    <div class="fs-seek">
      <div class="seek-wrap">
        <div id="fsEventTick" class="event-tick" hidden></div>
        <input type="range" id="fsSeekBar" min="0" max="100" value="0" step="0.1" />
      </div>
    </div>
  </div>

  <script src="/static/js/app.js?v=1.4.7"></script>
</body>
</html>
