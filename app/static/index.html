<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TeslaCam Viewer</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">TeslaCam Viewer</span>
      </div>
      <div class="controls">
        <div class="filter-group">
          <button class="filter-btn active" data-type="">All</button>
          <button class="filter-btn" data-type="saved">Saved</button>
          <button class="filter-btn" data-type="sentry">Sentry</button>
          <button class="filter-btn" data-type="recent">Recent</button>
        </div>
        <div class="date-filters">
          <input type="date" id="fromDate" title="From date" />
          <span>–</span>
          <input type="date" id="toDate" title="To date" />
          <button id="clearDates" class="btn-icon" title="Clear dates">✕</button>
        </div>
      </div>
      <div class="status" id="status">Loading…</div>
    </header>

    <!-- Main content -->
    <main class="main">
      <!-- Event list (sidebar) -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <span id="eventCount">0 events</span>
          <button id="refreshBtn" class="btn-icon" title="Refresh">↻</button>
        </div>
        <div class="event-list" id="eventList">
          <!-- Events injected here -->
        </div>
        <div class="load-more" id="loadMore" style="display:none;">
          <button id="loadMoreBtn">Load more</button>
        </div>
      </aside>

      <!-- Player area -->
      <section class="player-area" id="playerArea">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">📹</div>
          <h2>Select an event</h2>
          <p>Choose a clip from the list to view multi-camera playback</p>
        </div>

        <div class="player-container" id="playerContainer" style="display:none;">
          <div class="player-header">
            <div class="event-info">
              <span class="event-type-badge" id="eventTypeBadge"></span>
              <span class="event-datetime" id="eventDatetime"></span>
            </div>
            <div class="player-actions">
              <button id="syncPlayBtn" class="btn primary" title="Play / Pause all">▶ Play</button>
              <button id="syncMuteBtn" class="btn" title="Mute / Unmute">🔊</button>
              <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1" />
              <span id="timeDisplay">0:00 / 0:00</span>
            </div>
          </div>

          <div class="camera-grid" id="cameraGrid">
            <!-- Camera players injected here -->
          </div>

          <div class="event-meta" id="eventMeta" style="display:none;">
            <!-- event.json details -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
